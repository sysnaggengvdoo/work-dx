<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="倉庫ログ">

  <link rel="manifest" href="manifest.json">

  <title>倉庫ログ</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body
  class="bg-gray-100 font-sans pb-14"
  style="overscroll-behavior-y: none;"
>
  <div
    id="app"
    class="w-full mx-auto bg-white min-h-screen shadow-lg"
  >
    <header class="bg-teal-700 text-white p-4 sticky top-0 z-40 shadow-md">
      <div class="flex items-center justify-between gap-2 mb-3">
        <a
          href="past.html"
          class="bg-white/15 hover:bg-white/25 px-2 py-1.5 rounded text-[11px] sm:text-xs font-bold whitespace-nowrap"
        >
          ← 過去検索へ戻る
        </a>

        <h1 class="min-w-0 flex-1 text-lg sm:text-xl font-bold tracking-wider text-center">
          倉庫ログ
        </h1>

        <button
          type="button"
          @click="refreshData"
          class="bg-amber-500 hover:bg-amber-600 px-2 sm:px-3 py-1.5 rounded text-xs sm:text-sm font-bold shadow whitespace-nowrap"
        >
          🔄 更新
        </button>
      </div>

      <div class="flex gap-2">
        <input
          type="search"
          v-model="searchQuery"
          placeholder="整理No.、顧客名、作業内容、担当、日付、備考、倉庫名で検索..."
          class="min-w-0 flex-1 p-2 rounded text-black focus:outline-none focus:ring-2 focus:ring-teal-300 text-sm"
        >

        <button
          type="button"
          @click="clearSearch"
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded text-sm font-bold"
        >
          クリア
        </button>
      </div>
    </header>

    <main class="p-4">
      <div
        v-if="isLoading"
        class="text-center py-12"
      >
        <div class="animate-spin h-10 w-10 border-4 border-teal-500 border-t-transparent rounded-full mx-auto mb-4"></div>

        <p class="text-gray-600 font-bold">
          過去ログを読み込み中...
        </p>
      </div>

      <div
        v-else-if="error"
        class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg"
      >
        {{ error }}
      </div>

      <template v-else>
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 sm:gap-3 mb-3 text-sm">
          <p class="text-gray-600">
            倉庫ごとに折りたたみ表示しています。整理No.ごとの履歴も開閉できます。
          </p>

          <p class="text-gray-500 whitespace-nowrap text-right">
            該当:
            <span class="font-bold text-gray-900">
              {{ filteredWarehouseLogs.length }}
            </span>
            件 /
            <span class="font-bold text-gray-900">
              {{ filteredGroupCount }}
            </span>
            案件
          </p>
        </div>

        <div
          v-if="warehouseLogs.length === 0"
          class="mb-4 bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 rounded-lg text-sm"
        >
          過去ログAPIの「作業内容」に、対象3倉庫の正式名称を含む履歴がありません。
          スプレッドシートの作業内容に倉庫名を入力した履歴が保存された後、更新してください。
        </div>

        <div
          v-if="warehouseSections.length"
          class="space-y-4"
        >
          <section
            v-for="section in warehouseSections"
            :key="section.name"
            class="bg-white border border-gray-200 rounded-xl shadow-md overflow-hidden"
          >
            <button
              type="button"
              @click="toggleWarehouse(section.name)"
              class="w-full bg-teal-800 hover:bg-teal-700 text-white px-4 py-3 flex justify-between items-center transition"
            >
              <div class="min-w-0 flex items-center gap-2">
                <span class="text-lg">
                  📦
                </span>

                <span class="font-black text-lg truncate">
                  {{ section.name }}
                </span>
              </div>

              <div class="flex items-center gap-2 shrink-0">
                <span class="bg-white/20 px-2 py-0.5 rounded-full text-xs font-bold">
                  {{ section.recordsCount }}件 / {{ section.groups.length }}案件
                </span>

                <span class="text-sm font-black">
                  {{ isWarehouseExpanded(section.name) ? '▲' : '▼' }}
                </span>
              </div>
            </button>

            <div
              v-show="isWarehouseExpanded(section.name)"
              class="bg-gray-50 p-3 space-y-4"
            >
              <article
                v-for="group in section.groups"
                :key="group.key"
                class="bg-white border-2 border-gray-200 rounded-xl shadow-sm overflow-hidden"
              >
                <div class="bg-gray-800 text-white p-3 flex flex-col gap-2">
                  <div class="flex justify-between items-start gap-2">
                    <span class="font-black text-xl text-teal-200 leading-tight break-words">
                      {{ group.no }}
                    </span>

                    <span class="bg-gray-600 px-2 py-1 rounded text-xs font-bold shrink-0">
                      履歴 {{ group.records.length }}件
                    </span>
                  </div>

                  <div class="border-t border-gray-600"></div>

                  <div class="flex justify-between items-start gap-3 text-sm font-bold">
                    <div class="min-w-0 flex-1">
                      顧客名:
                      <span class="break-words">
                        {{ group.customer }}
                      </span>
                    </div>

                    <div
                      v-if="group.output"
                      class="shrink-0 text-right text-white"
                    >
                      出力: {{ group.output }}
                    </div>
                  </div>
                </div>

                <div class="p-4 space-y-5 bg-gray-50">
                  <div
                    v-for="(log, idx) in getVisibleRecords(group)"
                    :key="`${group.key}-${idx}-${getLogTime(log)}`"
                    class="relative pl-4 border-l-4 border-teal-400"
                  >
                    <div class="flex justify-between items-center mb-1 gap-2">
                      <div class="flex items-center gap-2 flex-wrap">
                        <span class="text-gray-600 text-xs font-bold bg-gray-200 px-2 py-0.5 rounded">
                          {{ formatDate(getDateValue(log)) }}
                        </span>

                        <span
                          class="text-[10px] font-bold px-1.5 py-0.5 rounded border"
                          :class="statusClass(log['完了確認'])"
                        >
                          {{ displayTextOrDash(log['完了確認']) }}
                        </span>
                      </div>

                      <span class="text-sm font-bold text-teal-800 text-right break-words">
                        担当: {{ displayTextOrDash(log['担当']) }}
                      </span>
                    </div>

                    <p class="text-sm mb-2 text-gray-800">
                      <span class="font-bold text-gray-500 text-xs">
                        作業内容:
                      </span>
                      <br>
                      <span class="whitespace-pre-wrap break-words">
                        {{ displayTextOrDash(log['作業内容']) }}
                      </span>
                    </p>

                    <div class="bg-yellow-50 p-3 rounded border border-yellow-300 shadow-sm mt-2">
                      <p class="font-bold text-yellow-800 mb-1 text-xs">
                        備考・引き継ぎ:
                      </p>

                      <p class="text-gray-800 whitespace-pre-wrap text-sm break-words">
                        {{ displayTextOrDash(getNoteValue(log)) }}
                      </p>
                    </div>
                  </div>

                  <button
                    v-if="group.records.length > 1"
                    type="button"
                    @click="toggleRecordGroup(group.key)"
                    class="w-full py-2 px-3 rounded-lg border border-gray-300 bg-white hover:bg-teal-50 text-teal-700 text-sm font-bold shadow-sm transition flex items-center justify-center gap-2"
                  >
                    <span v-if="isRecordGroupExpanded(group.key)">
                      ▲ 過去履歴を閉じる
                    </span>

                    <span v-else>
                      ▼ 過去履歴をさらに
                      {{ group.records.length - 1 }}件表示
                    </span>
                  </button>
                </div>
              </article>
            </div>
          </section>
        </div>

        <div
          v-else
          class="text-center py-12 text-gray-500 font-bold"
        >
          条件に一致する倉庫ログがありません。
        </div>
      </template>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 w-full mx-auto bg-white border-t-2 border-gray-300 flex justify-around z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
      <a
        href="index.html"
        class="flex items-center justify-center w-1/3 py-2 text-gray-500 border-r border-gray-200 font-bold text-lg hover:bg-gray-50 transition"
      >
        今日の作業
      </a>

      <a
        href="past.html"
        class="flex items-center justify-center w-1/3 py-2 text-teal-700 bg-teal-50 font-bold text-lg border-t-4 border-teal-700 transition"
      >
        過去検索
      </a>

      <a
        href="tools.html"
        class="flex items-center justify-center w-1/3 py-2 text-gray-500 border-l border-gray-200 font-bold text-lg hover:bg-gray-50 transition"
      >
        業務ツール
      </a>
    </nav>
  </div>

  <script>
    const {
      createApp,
      ref,
      computed,
      onMounted
    } = Vue;

    const API_URL =
      "https://script.google.com/macros/s/AKfycbxVOgnDwBg-VwK6kZSZ8GbYnTykbALW-KPiBLoTO4z0t9O16QWBlFVXlLWL-xCF0dLj/exec";

    const CACHE_KEY = "sec_warehouse_logs_cache_v2";

    const WAREHOUSE_NAMES = [
      "京浜島倉庫",
      "アラックス倉庫",
      "本社裏倉庫"
    ];

    /**
     * 検索・比較用の文字列正規化。
     *
     * NFKCでは①→1、②→2などの変換が行われるため、
     * 表示用の文字列には基本的に使用しない。
     */
    function normalizeText(value) {
      return String(value ?? "")
        .normalize("NFKC")
        .trim();
    }

    /**
     * 表示用の文字列整形。
     *
     * Unicode正規化を行わず、①・②・⓪などの
     * 丸数字を元の文字のまま保持する。
     */
    function preserveText(value) {
      return String(value ?? "").trim();
    }

    function getWarehouseName(log) {
      const workText = normalizeText(
        log && log["作業内容"]
      );

      return WAREHOUSE_NAMES.find((name) =>
        workText.includes(normalizeText(name))
      ) || "";
    }

    createApp({
      setup() {
        const allLogs = ref([]);
        const searchQuery = ref("");
        const isLoading = ref(true);
        const error = ref("");

        const expandedWarehouses = ref(
          WAREHOUSE_NAMES.reduce((result, name) => {
            result[name] = false;
            return result;
          }, {})
        );

        const expandedRecordGroups = ref({});

        const getDateValue = (log) =>
          log["TS"] ||
          log["タイムスタンプ"] ||
          log["日付"] ||
          "";

        const parseDateTime = (value) => {
          const text = normalizeText(value);

          if (!text) {
            return null;
          }

          const date = new Date(
            text.replace(/-/g, "/")
          );

          return Number.isNaN(date.getTime())
            ? null
            : date;
        };

        const getLogTime = (log) => {
          const date = parseDateTime(
            getDateValue(log)
          );

          return date
            ? date.getTime()
            : 0;
        };

        const formatDate = (value) => {
          const text = normalizeText(value);

          return text
            ? text.split(" ")[0]
            : "日付不明";
        };

        const getManagementNo = (log) => {
          const value = preserveText(
            log["整理№"] ??
            log["整理No"] ??
            log["整理No."] ??
            ""
          );

          return value || "整理Noなし";
        };

        const getNoteValue = (log) =>
          log["備考（引継ぎ・進捗状況等）"] ||
          log["備考"] ||
          "";

        const getOutputValue = (log) => {
          const candidates = [
            log["出"],
            log["出力"],
            log["出力(kW)"],
            log["容量"],
            log["容量(kW)"]
          ];

          for (const candidate of candidates) {
            const text = normalizeText(candidate);

            if (!text) {
              continue;
            }

            if (
              /^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/.test(text)
            ) {
              continue;
            }

            return text;
          }

          return "";
        };

        const displayTextOrDash = (value) =>
          preserveText(value) || "—";

        const statusClass = (status) => {
          const value = normalizeText(status);

          if (value === "完了") {
            return "bg-gray-600 text-white border-gray-600";
          }

          if (value === "完了予定") {
            return "bg-yellow-100 text-yellow-800 border-yellow-300";
          }

          if (value === "繰越") {
            return "bg-red-50 text-red-700 border-red-300";
          }

          return "bg-white text-gray-600 border-gray-300";
        };

        const toggleWarehouse = (warehouseName) => {
          expandedWarehouses.value = {
            ...expandedWarehouses.value,
            [warehouseName]: !expandedWarehouses.value[warehouseName]
          };
        };

        const isWarehouseExpanded = (warehouseName) => {
          return !!expandedWarehouses.value[warehouseName];
        };

        const toggleRecordGroup = (groupKey) => {
          expandedRecordGroups.value = {
            ...expandedRecordGroups.value,
            [groupKey]: !expandedRecordGroups.value[groupKey]
          };
        };

        const isRecordGroupExpanded = (groupKey) => {
          return !!expandedRecordGroups.value[groupKey];
        };

        const getVisibleRecords = (group) => {
          if (!group || !group.records) {
            return [];
          }

          if (isRecordGroupExpanded(group.key)) {
            return group.records;
          }

          return group.records.slice(0, 1);
        };

        const warehouseLogs = computed(() =>
          allLogs.value
            .filter((log) => getWarehouseName(log))
            .slice()
            .sort(
              (a, b) =>
                getLogTime(b) - getLogTime(a)
            )
        );

        const filteredWarehouseLogs = computed(() => {
          const searchWords = normalizeText(
            searchQuery.value
          )
            .toLowerCase()
            .replace(/　/g, " ")
            .split(/\s+/)
            .filter(Boolean);

          return warehouseLogs.value.filter((log) => {
            if (!searchWords.length) {
              return true;
            }

            const warehouseName =
              getWarehouseName(log);

            /*
             * 検索時はNFKC正規化する。
             *
             * これにより検索欄へ「25004731」と入力しても、
             * 表示値が「2500473①」のレコードを検索できる。
             * 表示値そのものは変更しない。
             */
            const searchableText = normalizeText([
              getManagementNo(log),
              log["顧客名"],
              log["作業内容"],
              log["担当"],
              getDateValue(log),
              getNoteValue(log),
              warehouseName
            ].join(" ")).toLowerCase();

            return searchWords.every((word) =>
              searchableText.includes(word)
            );
          });
        });

        const warehouseSections = computed(() =>
          WAREHOUSE_NAMES
            .map((warehouseName) => {
              const records =
                filteredWarehouseLogs.value.filter(
                  (log) =>
                    getWarehouseName(log) === warehouseName
                );

              const groupMap = {};

              records.forEach((log) => {
                const no = getManagementNo(log);
                const groupKey = `${warehouseName}::${no}`;
                const outputValue = getOutputValue(log);

                if (!groupMap[groupKey]) {
                  groupMap[groupKey] = {
                    key: groupKey,
                    no,
                    customer: "",
                    output: "",
                    records: []
                  };
                }

                if (!groupMap[groupKey].output && outputValue) {
                  groupMap[groupKey].output = outputValue;
                }

                groupMap[groupKey].records.push(log);
              });

              const groups = Object.values(groupMap)
                .map((group) => {
                  group.records.sort(
                    (a, b) =>
                      getLogTime(b) - getLogTime(a)
                  );

                  const latest = group.records[0] || {};

                  group.customer =
                    preserveText(latest["顧客名"]) ||
                    "—";

                  if (!group.output) {
                    group.output =
                      getOutputValue(latest);
                  }

                  return group;
                })
                .sort((a, b) => {
                  const latestA = a.records[0];
                  const latestB = b.records[0];

                  return (
                    getLogTime(latestB) -
                    getLogTime(latestA)
                  );
                });

              return {
                name: warehouseName,
                recordsCount: records.length,
                groups
              };
            })
            .filter(
              (section) =>
                section.recordsCount > 0
            )
        );

        const filteredGroupCount = computed(() =>
          warehouseSections.value.reduce(
            (sum, section) =>
              sum + section.groups.length,
            0
          )
        );

        const fetchAllData = async (
          forceRefresh = false
        ) => {
          error.value = "";

          if (forceRefresh) {
            localStorage.removeItem(CACHE_KEY);
            allLogs.value = [];
            isLoading.value = true;
          } else {
            const cached =
              localStorage.getItem(CACHE_KEY);

            if (cached) {
              try {
                const parsed = JSON.parse(cached);

                if (Array.isArray(parsed)) {
                  allLogs.value = parsed;
                  isLoading.value = false;
                }
              } catch (cacheError) {
                localStorage.removeItem(CACHE_KEY);

                console.warn(
                  "倉庫ログのキャッシュ読み込みに失敗しました。",
                  cacheError
                );
              }
            }
          }

          try {
            const response = await fetch(
              `${API_URL}?_=${Date.now()}`
            );

            if (!response.ok) {
              throw new Error(
                `HTTP ${response.status}`
              );
            }

            const json = await response.json();

            if (
              json.status !== "success" ||
              !Array.isArray(json.data)
            ) {
              throw new Error(
                json.message ||
                "過去ログAPIの返却形式が不正です。"
              );
            }

            allLogs.value = json.data;

            localStorage.setItem(
              CACHE_KEY,
              JSON.stringify(json.data)
            );
          } catch (fetchError) {
            console.error(
              "過去ログAPI通信エラー",
              fetchError
            );

            if (allLogs.value.length === 0) {
              error.value =
                "過去ログの取得に失敗しました。通信状況を確認して更新してください。";
            }
          } finally {
            isLoading.value = false;
          }
        };

        const refreshData = () =>
          fetchAllData(true);

        const clearSearch = () => {
          searchQuery.value = "";
          expandedRecordGroups.value = {};
        };

        onMounted(() => {
          fetchAllData();
        });

        return {
          searchQuery,
          isLoading,
          error,
          warehouseLogs,
          filteredWarehouseLogs,
          warehouseSections,
          filteredGroupCount,
          refreshData,
          clearSearch,
          getWarehouseName,
          getDateValue,
          getLogTime,
          formatDate,
          getManagementNo,
          getNoteValue,
          getOutputValue,
          displayTextOrDash,
          statusClass,
          toggleWarehouse,
          isWarehouseExpanded,
          toggleRecordGroup,
          isRecordGroupExpanded,
          getVisibleRecords
        };
      }
    }).mount("#app");
  </script>
</body>
</html>
