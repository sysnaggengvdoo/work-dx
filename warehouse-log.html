<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="倉庫ログ">
  <link rel="manifest" href="manifest.json">
  <title>倉庫ログ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="bg-gray-100 font-sans pb-14" style="overscroll-behavior-y: none;">
  <div id="app" class="w-full mx-auto bg-white min-h-screen shadow-lg">
    <header class="bg-teal-700 text-white p-4 sticky top-0 z-40 shadow-md">
      <div class="flex items-center justify-between gap-2 mb-3">
        <a href="past.html" class="bg-white/15 hover:bg-white/25 px-2 py-1.5 rounded text-[11px] sm:text-xs font-bold whitespace-nowrap">
          ← 過去検索へ戻る
        </a>
        <h1 class="min-w-0 flex-1 text-lg sm:text-xl font-bold tracking-wider text-center">倉庫ログ</h1>
        <button
          type="button"
          @click="refreshData"
          class="bg-amber-500 hover:bg-amber-600 px-2 sm:px-3 py-1.5 rounded text-xs sm:text-sm font-bold shadow whitespace-nowrap"
        >
          🔄 更新
        </button>
      </div>

      <div class="flex gap-2">
        <input
          type="search"
          v-model="searchQuery"
          placeholder="整理No.、顧客名、作業内容、担当、日付、備考、倉庫名で検索..."
          class="min-w-0 flex-1 p-2 rounded text-black focus:outline-none focus:ring-2 focus:ring-teal-300 text-sm"
        >
        <button
          type="button"
          @click="clearSearch"
          class="bg-gray-200 hover:bg-gray-300 text-gray-800 px-3 py-2 rounded text-sm font-bold"
        >
          クリア
        </button>
      </div>

      <div class="mt-3 flex gap-2 overflow-x-auto pb-1" aria-label="倉庫フィルター">
        <button
          v-for="option in filterOptions"
          :key="option.value || 'all'"
          type="button"
          @click="activeWarehouse = option.value"
          class="px-3 py-1.5 rounded-full text-xs font-bold whitespace-nowrap border transition"
          :class="activeWarehouse === option.value
            ? 'bg-white text-teal-800 border-white shadow'
            : 'bg-teal-800 text-white border-teal-500 hover:bg-teal-600'"
        >
          {{ option.label }}（{{ option.count }}）
        </button>
      </div>
    </header>

    <main class="p-4">
      <div v-if="isLoading" class="text-center py-12">
        <div class="animate-spin h-10 w-10 border-4 border-teal-500 border-t-transparent rounded-full mx-auto mb-4"></div>
        <p class="text-gray-600 font-bold">過去ログを読み込み中...</p>
      </div>

      <div v-else-if="error" class="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded-lg">
        {{ error }}
      </div>

      <template v-else>
        <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1 sm:gap-3 mb-3 text-sm">
          <p class="text-gray-600">
            対象倉庫の履歴を、日付の新しい順に表示しています。
          </p>
          <p class="text-gray-500 whitespace-nowrap text-right">
            該当: <span class="font-bold text-gray-900">{{ filteredWarehouseLogs.length }}</span> 件
          </p>
        </div>

        <div
          v-if="warehouseLogs.length === 0"
          class="mb-4 bg-amber-50 border border-amber-300 text-amber-900 px-4 py-3 rounded-lg text-sm"
        >
          過去ログAPIの「次工程」に、対象3倉庫の正式名称と完全一致する履歴がありません。
          スプレッドシートで倉庫名を選択した履歴が保存された後、更新してください。
        </div>

        <div v-if="groupedLogs.length" class="space-y-7">
          <section v-for="group in groupedLogs" :key="group.name">
            <div class="bg-teal-800 text-white px-4 py-2 rounded-t-lg flex justify-between items-center shadow">
              <h2 class="font-black text-lg">📦 {{ group.name }}</h2>
              <span class="bg-white/20 px-2 py-0.5 rounded-full text-xs font-bold">{{ group.records.length }}件</span>
            </div>

            <div class="border border-t-0 border-gray-200 rounded-b-lg bg-gray-50 p-3 space-y-3">
              <article
                v-for="(log, index) in group.records"
                :key="`${group.name}-${getLogTime(log)}-${index}`"
                class="bg-white border border-gray-200 border-l-4 border-l-teal-500 rounded-lg shadow-sm p-4"
              >
                <div class="flex flex-wrap justify-between items-start gap-2 border-b border-gray-200 pb-2 mb-3">
                  <div>
                    <p class="text-xs text-gray-500 font-bold">日付</p>
                    <p class="font-black text-gray-800">{{ formatDate(getDateValue(log)) }}</p>
                  </div>
                  <span class="bg-teal-100 text-teal-800 px-2.5 py-1 rounded-full text-xs font-bold">
                    {{ getWarehouseName(log) }}
                  </span>
                </div>

                <dl class="grid grid-cols-1 sm:grid-cols-2 gap-x-5 gap-y-3 text-sm">
                  <div>
                    <dt class="text-xs font-bold text-gray-500">整理No.</dt>
                    <dd class="font-bold text-blue-800 break-words">{{ getManagementNo(log) }}</dd>
                  </div>
                  <div>
                    <dt class="text-xs font-bold text-gray-500">顧客名</dt>
                    <dd class="font-bold text-gray-800 break-words">{{ textOrDash(log['顧客名']) }}</dd>
                  </div>
                  <div class="sm:col-span-2">
                    <dt class="text-xs font-bold text-gray-500">作業内容</dt>
                    <dd class="text-gray-800 whitespace-pre-wrap break-words">{{ textOrDash(log['作業内容']) }}</dd>
                  </div>
                  <div>
                    <dt class="text-xs font-bold text-gray-500">担当</dt>
                    <dd class="text-gray-800 break-words">{{ textOrDash(log['担当']) }}</dd>
                  </div>
                  <div>
                    <dt class="text-xs font-bold text-gray-500">完了確認</dt>
                    <dd>
                      <span
                        class="inline-block px-2 py-0.5 rounded border text-xs font-bold"
                        :class="statusClass(log['完了確認'])"
                      >
                        {{ textOrDash(log['完了確認']) }}
                      </span>
                    </dd>
                  </div>
                  <div v-if="getOutputValue(log)">
                    <dt class="text-xs font-bold text-gray-500">出力</dt>
                    <dd class="font-bold text-gray-800 break-words">{{ getOutputValue(log) }}</dd>
                  </div>
                  <div class="sm:col-span-2">
                    <dt class="text-xs font-bold text-gray-500">備考</dt>
                    <dd class="bg-yellow-50 border border-yellow-200 rounded p-2 text-gray-800 whitespace-pre-wrap break-words">
                      {{ textOrDash(getNoteValue(log)) }}
                    </dd>
                  </div>
                </dl>
              </article>
            </div>
          </section>
        </div>

        <div v-else class="text-center py-12 text-gray-500 font-bold">
          条件に一致する倉庫ログがありません。
        </div>
      </template>
    </main>

    <nav class="fixed bottom-0 left-0 right-0 w-full mx-auto bg-white border-t-2 border-gray-300 flex justify-around z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
      <a href="index.html" class="flex items-center justify-center w-1/3 py-2 text-gray-500 border-r border-gray-200 font-bold text-lg hover:bg-gray-50 transition">
        今日の作業
      </a>
      <a href="past.html" class="flex items-center justify-center w-1/3 py-2 text-teal-700 bg-teal-50 font-bold text-lg border-t-4 border-teal-700 transition">
        過去検索
      </a>
      <a href="tools.html" class="flex items-center justify-center w-1/3 py-2 text-gray-500 border-l border-gray-200 font-bold text-lg hover:bg-gray-50 transition">
        業務ツール
      </a>
    </nav>
  </div>

  <script>
    const { createApp, ref, computed, onMounted } = Vue;

    const API_URL = "https://script.google.com/macros/s/AKfycbxVOgnDwBg-VwK6kZSZ8GbYnTykbALW-KPiBLoTO4z0t9O16QWBlFVXlLWL-xCF0dLj/exec";
    const CACHE_KEY = "sec_warehouse_logs_cache_v1";
    const WAREHOUSE_NAMES = [
      "京浜島倉庫",
      "アラックス倉庫",
      "本社裏倉庫"
    ];

    // 過去ログAPIの実返却ヘッダーを確認し、入力規則の値が入る「次工程」を使用する。
    const WAREHOUSE_FIELD_KEY = "次工程";

    function normalizeText(value) {
      return String(value || "").normalize("NFKC").trim();
    }

    function getWarehouseName(log) {
      const value = normalizeText(log && log[WAREHOUSE_FIELD_KEY]);
      return WAREHOUSE_NAMES.includes(value) ? value : "";
    }

    createApp({
      setup() {
        const allLogs = ref([]);
        const searchQuery = ref("");
        const activeWarehouse = ref("");
        const isLoading = ref(true);
        const error = ref("");

        const getDateValue = (log) => log['TS'] || log['タイムスタンプ'] || log['日付'] || '';

        const parseDateTime = (value) => {
          const text = normalizeText(value);
          if (!text) return null;
          const date = new Date(text.replace(/-/g, '/'));
          return Number.isNaN(date.getTime()) ? null : date;
        };

        const getLogTime = (log) => {
          const date = parseDateTime(getDateValue(log));
          return date ? date.getTime() : 0;
        };

        const formatDate = (value) => {
          const text = normalizeText(value);
          return text ? text.split(' ')[0] : '日付不明';
        };

        const getManagementNo = (log) => {
          const value = normalizeText(log['整理№'] || log['整理No'] || log['整理No.']);
          return value || '整理Noなし';
        };

        const getNoteValue = (log) => (
          log['備考（引継ぎ・進捗状況等）'] || log['備考'] || ''
        );

        const getOutputValue = (log) => {
          const candidates = [
            log['出'],
            log['出力'],
            log['出力(kW)'],
            log['容量'],
            log['容量(kW)']
          ];

          for (const candidate of candidates) {
            const text = normalizeText(candidate);
            if (!text) continue;
            if (/^\d{4}[\/-]\d{1,2}[\/-]\d{1,2}/.test(text)) continue;
            return text;
          }

          return '';
        };

        const textOrDash = (value) => normalizeText(value) || '—';

        const statusClass = (status) => {
          const value = normalizeText(status);
          if (value === '完了') return 'bg-gray-600 text-white border-gray-600';
          if (value === '完了予定') return 'bg-yellow-100 text-yellow-800 border-yellow-300';
          if (value === '繰越') return 'bg-red-50 text-red-700 border-red-300';
          return 'bg-white text-gray-600 border-gray-300';
        };

        const warehouseLogs = computed(() => allLogs.value
          .filter(log => getWarehouseName(log))
          .slice()
          .sort((a, b) => getLogTime(b) - getLogTime(a))
        );

        const filterOptions = computed(() => [
          { label: 'すべて', value: '', count: warehouseLogs.value.length },
          ...WAREHOUSE_NAMES.map(name => ({
            label: name,
            value: name,
            count: warehouseLogs.value.filter(log => getWarehouseName(log) === name).length
          }))
        ]);

        const filteredWarehouseLogs = computed(() => {
          const searchWords = normalizeText(searchQuery.value)
            .toLowerCase()
            .replace(/　/g, ' ')
            .split(/\s+/)
            .filter(Boolean);

          return warehouseLogs.value.filter(log => {
            const warehouseName = getWarehouseName(log);
            if (activeWarehouse.value && warehouseName !== activeWarehouse.value) return false;

            if (!searchWords.length) return true;

            const searchableText = normalizeText([
              getManagementNo(log),
              log['顧客名'],
              log['作業内容'],
              log['担当'],
              getDateValue(log),
              getNoteValue(log),
              warehouseName
            ].join(' ')).toLowerCase();

            return searchWords.every(word => searchableText.includes(word));
          });
        });

        const groupedLogs = computed(() => WAREHOUSE_NAMES
          .filter(name => !activeWarehouse.value || name === activeWarehouse.value)
          .map(name => ({
            name,
            records: filteredWarehouseLogs.value.filter(log => getWarehouseName(log) === name)
          }))
          .filter(group => group.records.length > 0)
        );

        const fetchAllData = async (forceRefresh = false) => {
          error.value = '';

          if (forceRefresh) {
            localStorage.removeItem(CACHE_KEY);
            allLogs.value = [];
            isLoading.value = true;
          } else {
            const cached = localStorage.getItem(CACHE_KEY);
            if (cached) {
              try {
                const parsed = JSON.parse(cached);
                if (Array.isArray(parsed)) {
                  allLogs.value = parsed;
                  isLoading.value = false;
                }
              } catch (cacheError) {
                localStorage.removeItem(CACHE_KEY);
                console.warn('倉庫ログのキャッシュ読み込みに失敗しました。', cacheError);
              }
            }
          }

          try {
            const response = await fetch(`${API_URL}?_=${Date.now()}`);
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const json = await response.json();
            if (json.status !== 'success' || !Array.isArray(json.data)) {
              throw new Error(json.message || '過去ログAPIの返却形式が不正です。');
            }

            allLogs.value = json.data;
            localStorage.setItem(CACHE_KEY, JSON.stringify(json.data));
          } catch (fetchError) {
            console.error('過去ログAPI通信エラー', fetchError);
            if (allLogs.value.length === 0) {
              error.value = '過去ログの取得に失敗しました。通信状況を確認して更新してください。';
            }
          } finally {
            isLoading.value = false;
          }
        };

        const refreshData = () => fetchAllData(true);
        const clearSearch = () => {
          searchQuery.value = '';
          activeWarehouse.value = '';
        };

        onMounted(() => fetchAllData());

        return {
          searchQuery,
          activeWarehouse,
          isLoading,
          error,
          warehouseLogs,
          filteredWarehouseLogs,
          groupedLogs,
          filterOptions,
          refreshData,
          clearSearch,
          getWarehouseName,
          getDateValue,
          getLogTime,
          formatDate,
          getManagementNo,
          getNoteValue,
          getOutputValue,
          textOrDash,
          statusClass
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
