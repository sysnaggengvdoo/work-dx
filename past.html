<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="作業指示書">
  <link rel="manifest" href="manifest.json">
  <title>過去検索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body class="bg-gray-100 font-sans pb-12" style="overscroll-behavior-y: none;">
  <div id="app" class="w-full mx-auto bg-white min-h-screen shadow-lg">
    
    <header id="past-header" class="bg-blue-700 text-white p-4 sticky top-0 z-40 shadow-md">
      <div class="flex justify-center items-center mb-3">
        <h1 class="text-xl font-bold tracking-wider">過去検索</h1>
      </div>
      
      <div class="relative">
        <input 
          type="text" 
          v-model="searchQuery" 
          placeholder="整理No、顧客名、担当、日付で検索..." 
          class="w-full p-2 rounded text-black focus:outline-none focus:ring-2 focus:ring-blue-400 text-sm"
        >
      </div>
      
      <div class="mt-2 flex gap-2">
        <button
          @click="showYesterday"
          class="flex-1 bg-green-500 hover:bg-green-600 text-white py-1.5 rounded text-sm font-bold shadow transition"
        >
          前日表示
        </button>

        <button
          @click="clearSearch"
          class="bg-gray-300 hover:bg-gray-400 text-gray-800 px-3 py-1.5 rounded text-sm font-bold shadow transition"
        >
          クリア
        </button>

        <a
          href="warehouse-log.html"
          class="bg-teal-600 hover:bg-teal-700 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition whitespace-nowrap shrink-0"
        >
          📦 倉庫ログ
        </a>

        <button
          @click="refreshData"
          :disabled="isLoading || isRefreshing"
          class="bg-amber-500 hover:bg-amber-600 text-white px-3 py-1.5 rounded text-sm font-bold shadow transition disabled:opacity-60 disabled:cursor-not-allowed"
        >
          <span v-if="isRefreshing">⏳ 更新中</span>
          <span v-else>🔄 更新</span>
        </button>
      </div>
    </header>

    <main id="past-log-main" class="p-4">
      <div v-if="isLoading" class="text-center py-10">
        <div class="animate-spin h-10 w-10 border-4 border-blue-500 border-t-transparent rounded-full mx-auto mb-4"></div>
        <p class="text-gray-600 font-bold">データを読み込み中...</p>
      </div>

      <div v-else>
        <div
          v-if="error"
          class="bg-amber-50 border border-amber-400 text-amber-800 px-4 py-3 rounded mb-3"
        >
          {{ error }}
        </div>

        <div
          v-if="isRefreshing"
          class="bg-blue-50 border border-blue-200 text-blue-700 px-3 py-2 rounded mb-3 text-sm font-bold"
        >
          最新データを取得しています。現在の一覧はそのまま利用できます。
        </div>

        <template v-if="hasUsableData || !error">
        <p class="text-sm text-gray-500 mb-3 text-right">
          該当:
          <span class="font-bold text-gray-800">
            {{ filteredGroupedLogs.length }}
          </span>
          案件
        </p>
        
        <div class="space-y-6">
          <div
            v-for="group in filteredGroupedLogs"
            :key="group.no"
            class="bg-white border-2 border-gray-200 rounded-xl shadow-md overflow-hidden"
          >
            <div class="bg-gray-800 text-white p-3 flex flex-col gap-2">
              <div class="flex justify-between items-start gap-2">
                <span class="font-black text-xl text-blue-300 leading-tight">
                  {{ group.no }}
                </span>

                <div class="flex items-center gap-2 shrink-0">
                  <span class="bg-gray-600 px-2 py-1 rounded text-xs font-bold">
                    履歴 {{ group.records.length }}件
                  </span>

                  <span
                    v-if="calcLeadTimeText(group)"
                    class="bg-purple-600 px-2 py-1 rounded text-xs font-bold text-white"
                  >
                    LT: {{ calcLeadTimeText(group) }}
                  </span>
                </div>
              </div>

              <div class="border-t border-gray-600"></div>

              <div class="flex justify-between items-start gap-3 text-sm font-bold">
                <div class="min-w-0 flex-1">
                  顧客名:
                  <span class="break-words">
                    {{ group.customer }}
                  </span>
                </div>

                <div
                  v-if="group.output"
                  class="shrink-0 text-right text-white"
                >
                  出力: {{ group.output }}
                </div>
              </div>
            </div>

            <div class="p-4 space-y-5 bg-gray-50">
              <div
                v-for="(log, idx) in getVisibleRecords(group)"
                :key="`${group.no}-${idx}-${log['TS'] || log['タイムスタンプ'] || log['日付'] || ''}`"
                class="relative pl-4 border-l-4 border-blue-400"
              >
                <div class="flex justify-between items-center mb-1">
                  <div class="flex items-center gap-2">
                    <span class="text-gray-600 text-xs font-bold bg-gray-200 px-2 py-0.5 rounded">
                      {{ formatDate(log['TS'] || log['タイムスタンプ'] || log['日付']) }}
                    </span>

                    <span
                      v-if="log['完了確認']"
                      class="text-[10px] font-bold px-1.5 py-0.5 rounded border"
                      :class="{
                        'bg-gray-500 text-white border-gray-500':
                          log['完了確認'] === '完了',

                        'bg-yellow-200 text-yellow-800 border-yellow-400':
                          log['完了確認'] === '完了予定',

                        'bg-red-100 text-red-600 border-red-300':
                          log['完了確認'] === '繰越',

                        'bg-white text-gray-500 border-gray-300':
                          !['完了', '完了予定', '繰越'].includes(log['完了確認'])
                      }"
                    >
                      {{ log['完了確認'] }}
                    </span>
                  </div>

                  <span class="text-sm font-bold text-blue-800">
                    {{ getTantoLabel(log) }}: {{ log['担当'] }}
                  </span>
                </div>

                <p class="text-sm mb-2 text-gray-800">
                  <span class="font-bold text-gray-500 text-xs">
                    作業内容:
                  </span>
                  <br>
                  {{ log['作業内容'] }}
                </p>

                <div class="bg-yellow-100 p-3 rounded border border-yellow-300 shadow-sm mt-2">
                  <p class="font-bold text-yellow-800 mb-1 text-xs">
                    備考・引き継ぎ:
                  </p>

                  <p class="text-gray-800 whitespace-pre-wrap text-sm">
                    {{
                      log['備考（引継ぎ・進捗状況等）'] ||
                      log['備考'] ||
                      'なし'
                    }}
                  </p>
                </div>
              </div>

              <button
                v-if="group.records.length > 1"
                @click="toggleGroup(group.no)"
                class="w-full py-2 px-3 rounded-lg border border-gray-300 bg-white hover:bg-blue-50 text-blue-700 text-sm font-bold shadow-sm transition flex items-center justify-center gap-2"
              >
                <span v-if="isGroupExpanded(group.no)">
                  ▲ 過去履歴を閉じる
                </span>

                <span v-else>
                  ▼ 過去履歴をさらに
                  {{ group.records.length - 1 }}件表示
                </span>
              </button>
            </div>
          </div>

          <div
            v-if="filteredGroupedLogs.length === 0"
            class="text-center py-10 text-gray-500 font-bold"
          >
            履歴が見つかりません。
          </div>
        </div>
        </template>
      </div>
    </main>
    
    <nav class="fixed bottom-0 left-0 right-0 w-full mx-auto bg-white border-t-2 border-gray-300 flex justify-around z-50 shadow-[0_-5px_10px_rgba(0,0,0,0.05)]">
      <div
        onclick="window.location.replace('index.html');"
        class="cursor-pointer flex items-center justify-center w-1/3 py-2 text-gray-500 border-r border-gray-200 font-bold text-lg hover:bg-gray-50 transition"
      >
        今日の作業
      </div>

      <div
        id="nav-past"
        class="cursor-pointer flex items-center justify-center w-1/3 py-2 text-blue-700 bg-blue-50 font-bold text-lg border-t-4 border-blue-700 transition"
      >
        過去検索
      </div>

      <div
        id="nav-tools"
        onclick="window.location.replace('tools.html');"
        class="cursor-pointer flex items-center justify-center w-1/3 py-2 text-gray-500 border-l border-gray-200 font-bold text-lg hover:bg-gray-50 transition"
      >
        業務ツール
      </div>
    </nav>
  </div>

  <script>
    const {
      createApp,
      ref,
      computed,
      onMounted,
      onBeforeUnmount
    } = Vue;

    createApp({
      setup() {
        const API_URL =
          "https://script.google.com/macros/s/AKfycbxVOgnDwBg-VwK6kZSZ8GbYnTykbALW-KPiBLoTO4z0t9O16QWBlFVXlLWL-xCF0dLj/exec";
        
        // キャッシュ用キー
        const CACHE_KEY = "sec_past_logs_cache_v36";
        const CACHE_TIME_KEY = `${CACHE_KEY}_saved_at`;
        const CACHE_TTL_MS = 5 * 60 * 1000;
        const FETCH_TIMEOUT_MS = 40 * 1000;

        // 倉庫作業で使用する固定整理No.
        const WAREHOUSE_MANAGEMENT_NO = "9900000";

        // 過去検索から除外する整理No.
        const EXCLUDED_MANAGEMENT_NOS = new Set([
          WAREHOUSE_MANAGEMENT_NO
        ]);

        const allLogs = ref([]);
        const searchQuery = ref("");
        const isLoading = ref(true);
        const isRefreshing = ref(false);
        const error = ref(null);
        const expandedGroups = ref({});
        const hasUsableData = ref(false);

        let activeRequestId = 0;
        let activeController = null;
        let isPageActive = true;

        const formatDate = (val) => {
          if (!val) return "日付不明";
          return String(val).split(" ")[0];
        };

        /**
         * 9900000の倉庫作業から、作業内容に記載された
         * 7桁の実案件整理No.を抽出する。
         *
         * 全角数字だけを半角へ変換し、①などの丸数字は保持する。
         * 同じ番号が複数回書かれていても、案件への追加は1回にする。
         */
        const extractRelatedManagementNos = (log) => {
          const workText = String(
            log["作業内容"] || ""
          ).replace(/[０-９]/g, char =>
            String.fromCharCode(
              char.charCodeAt(0) - 0xFEE0
            )
          );

          const relatedNos = [];
          const managementNoPattern =
            /(^|[^0-9])([0-9]{7}[①-⑳]?)(?![0-9])/g;

          let match;

          while (
            (match = managementNoPattern.exec(workText)) !== null
          ) {
            const relatedNo = match[2];

            if (
              relatedNo !== WAREHOUSE_MANAGEMENT_NO &&
              !relatedNos.includes(relatedNo)
            ) {
              relatedNos.push(relatedNo);
            }
          }

          return relatedNos;
        };

        const getTantoLabel = (log) => {
          const dept = String(
            log["部署"] ||
            log["部門"] ||
            log["分類"] ||
            log["区分"] ||
            log["範囲"] ||
            ""
          );

          const tanto = String(log["担当"] || "");

          if (
            dept.includes("出張") ||
            dept.includes("車両") ||
            dept.includes("運搬") ||
            tanto.includes("人乗り") ||
            tanto.includes("号車") ||
            tanto.includes("社用車") ||
            tanto.includes("レンタ") ||
            tanto.includes("トラック") ||
            tanto.includes("ハイエース") ||
            tanto.includes("軽バン")
          ) {
            return "車両";
          }

          return "担当";
        };

        const parseDateTime = (val) => {
          if (!val) return null;
          if (val instanceof Date) return val;

          const str = String(val).trim();
          if (!str) return null;

          const date = new Date(str.replace(/-/g, "/"));

          if (isNaN(date.getTime())) {
            return null;
          }

          return date;
        };

        // 日付だけを比較するため、時刻を00:00:00に揃える
        const parseDateOnly = (val) => {
          const dateTime = parseDateTime(val);

          if (!dateTime) {
            return null;
          }

          return new Date(
            dateTime.getFullYear(),
            dateTime.getMonth(),
            dateTime.getDate()
          );
        };

        const getLogTime = (log) => {
          const date = parseDateTime(
            log["TS"] ||
            log["タイムスタンプ"] ||
            log["日付"]
          );

          return date ? date.getTime() : 0;
        };

        // 案件単位のLTを算出
        // 定義：同じ整理Noの初回DB登録日から最終DB登録日までの日数
        // 同日完結は1日として扱う
        const calcLeadTimeText = (group) => {
          if (
            !group ||
            !group.records ||
            group.records.length === 0
          ) {
            return "";
          }

          const dates = group.records
            .map(log =>
              parseDateOnly(
                log["TS"] ||
                log["タイムスタンプ"] ||
                log["日付"]
              )
            )
            .filter(date => date !== null);

          if (dates.length === 0) {
            return "";
          }

          const minTime = Math.min(
            ...dates.map(date => date.getTime())
          );

          const maxTime = Math.max(
            ...dates.map(date => date.getTime())
          );

          const diffDays =
            Math.floor(
              (maxTime - minTime) /
              (1000 * 60 * 60 * 24)
            ) + 1;

          if (diffDays <= 0) {
            return "";
          }

          return `${diffDays}日`;
        };

        const getOutputValue = (log) => {
          const candidates = [
            log["出"],
            log["出力"],
            log["出力(kW)"],
            log["容量"],
            log["容量(kW)"]
          ];

          for (const value of candidates) {
            if (value === undefined || value === null) {
              continue;
            }

            const text = String(value).trim();

            if (!text) {
              continue;
            }

            if (/^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}/.test(text)) {
              continue;
            }

            return text;
          }

          return "";
        };

        const getNoSortValue = (no) => {
          const matches = String(no || "").match(/\d+/g);

          if (!matches) {
            return -1;
          }

          const mainNumbers = matches
            .map(value => Number(value))
            .filter(value => value >= 1000);

          if (mainNumbers.length > 0) {
            return Math.max(...mainNumbers);
          }

          return Math.max(
            ...matches.map(value => Number(value))
          );
        };

        const isGroupExpanded = (groupNo) => {
          return !!expandedGroups.value[groupNo];
        };

        const toggleGroup = (groupNo) => {
          expandedGroups.value = {
            ...expandedGroups.value,
            [groupNo]: !expandedGroups.value[groupNo]
          };
        };

        const getVisibleRecords = (group) => {
          if (!group || !group.records) {
            return [];
          }

          if (isGroupExpanded(group.no)) {
            return group.records;
          }

          return group.records.slice(0, 1);
        };

        const loadCachedData = () => {
          const cachedStr = localStorage.getItem(CACHE_KEY);

          if (!cachedStr) {
            return {
              hasCache: false,
              isFresh: false
            };
          }

          try {
            const cachedData = JSON.parse(cachedStr);

            if (!Array.isArray(cachedData)) {
              throw new Error("キャッシュ形式が不正です。");
            }

            allLogs.value = cachedData;
            hasUsableData.value = true;
            isLoading.value = false;

            const savedAt = Number(
              localStorage.getItem(CACHE_TIME_KEY) || 0
            );

            return {
              hasCache: true,
              isFresh:
                savedAt > 0 &&
                Date.now() - savedAt < CACHE_TTL_MS
            };
          } catch (e) {
            console.warn("キャッシュパース失敗", e);
            localStorage.removeItem(CACHE_KEY);
            localStorage.removeItem(CACHE_TIME_KEY);

            return {
              hasCache: false,
              isFresh: false
            };
          }
        };

        const cancelActiveRequest = () => {
          activeRequestId += 1;

          if (activeController) {
            activeController.abort();
            activeController = null;
          }

          isRefreshing.value = false;
        };

        // キャッシュを表示したまま、最新データを安全に取得する
        const fetchAllData = async () => {
          cancelActiveRequest();

          const requestId = activeRequestId;
          const controller = new AbortController();
          const hadUsableData = hasUsableData.value;
          let didTimeout = false;

          activeController = controller;
          error.value = null;

          if (hadUsableData) {
            isRefreshing.value = true;
            isLoading.value = false;
          } else {
            isLoading.value = true;
          }

          const timeoutId = setTimeout(() => {
            didTimeout = true;
            controller.abort();
          }, FETCH_TIMEOUT_MS);

          try {
            const response = await fetch(
              `${API_URL}?_=${Date.now()}`,
              {
                signal: controller.signal,
                cache: "no-store"
              }
            );

            if (!response.ok) {
              throw new Error(
                `HTTPエラー: ${response.status}`
              );
            }

            const json = await response.json();

            if (
              !json ||
              json.status !== "success" ||
              !Array.isArray(json.data)
            ) {
              throw new Error(
                json && json.message
                  ? json.message
                  : "データ形式が不正です。"
              );
            }

            if (
              requestId !== activeRequestId ||
              !isPageActive
            ) {
              return;
            }

            const freshData = [...json.data].reverse();

            allLogs.value = freshData;
            hasUsableData.value = true;
            error.value = null;

            try {
              localStorage.setItem(
                CACHE_KEY,
                JSON.stringify(freshData)
              );
              localStorage.setItem(
                CACHE_TIME_KEY,
                String(Date.now())
              );
            } catch (cacheError) {
              console.warn(
                "キャッシュ保存失敗",
                cacheError
              );
            }
          } catch (e) {
            const isCurrentRequest =
              requestId === activeRequestId;

            if (
              !isCurrentRequest ||
              (
                e.name === "AbortError" &&
                !didTimeout
              )
            ) {
              return;
            }

            if (didTimeout) {
              error.value = hadUsableData
                ? "更新に時間がかかっています。現在表示中のデータをそのまま利用できます。"
                : "データ取得がタイムアウトしました。時間をおいて更新してください。";
            } else {
              error.value = hadUsableData
                ? "更新に失敗しました。現在表示中のデータをそのまま利用できます。"
                : "通信エラーが発生しました。時間をおいて更新してください。";
            }

            console.error("API通信エラー", e);
          } finally {
            clearTimeout(timeoutId);

            if (requestId === activeRequestId) {
              activeController = null;
              isLoading.value = false;
              isRefreshing.value = false;
            }
          }
        };

        const refreshData = () => {
          if (
            isLoading.value ||
            isRefreshing.value
          ) {
            return;
          }

          fetchAllData();
        };

        const groupedLogs = computed(() => {
          const groups = {};

          const addLogToGroup = (
            no,
            log,
            isRelatedWarehouseLog = false
          ) => {
            const outputValue = getOutputValue(log);
            const customerValue = String(
              log["顧客名"] || "未入力"
            );

            if (!groups[no]) {
              groups[no] = {
                no: no,
                customer: customerValue,
                output: outputValue,
                records: [],
                hasDirectRecord: !isRelatedWarehouseLog
              };
            } else if (
              !isRelatedWarehouseLog &&
              !groups[no].hasDirectRecord
            ) {
              /*
               * 先に倉庫作業から案件グループが作られていても、
               * 通常の案件履歴が見つかった時点で顧客名・出力を
               * 本来の案件情報へ置き換える。
               */
              groups[no].customer = customerValue;
              groups[no].output = outputValue;
              groups[no].hasDirectRecord = true;
            } else if (
              !groups[no].output &&
              outputValue
            ) {
              groups[no].output = outputValue;
            }

            groups[no].records.push(log);
          };

          allLogs.value.forEach(log => {
            const no = String(
              log["整理№"] ||
              log["整理No"] ||
              log["整理No."] ||
              "Noなし"
            ).trim();

            if (no === WAREHOUSE_MANAGEMENT_NO) {
              /*
               * 9900000自体は過去検索へ表示しない。
               * 作業内容中の実案件整理No.へ同じ履歴を紐づける。
               * 複数番号が書かれている場合は、各案件へ追加する。
               */
              extractRelatedManagementNos(log).forEach(
                relatedNo => {
                  addLogToGroup(
                    relatedNo,
                    log,
                    true
                  );
                }
              );

              return;
            }

            if (EXCLUDED_MANAGEMENT_NOS.has(no)) {
              return;
            }

            addLogToGroup(no, log);
          });

          Object.values(groups).forEach(group => {
            group.records.sort(
              (a, b) => getLogTime(b) - getLogTime(a)
            );
          });

          return Object.values(groups).sort((a, b) => {
            const diff =
              getNoSortValue(b.no) -
              getNoSortValue(a.no);

            if (diff !== 0) {
              return diff;
            }

            return String(b.no).localeCompare(
              String(a.no),
              "ja"
            );
          });
        });

        // 全角・半角スペース対応＆AND複数条件検索
        const filteredGroupedLogs = computed(() => {
          if (!searchQuery.value) {
            return groupedLogs.value;
          }
          
          const searchWords = searchQuery.value
            .toLowerCase()
            .replace(/　/g, " ")
            .split(" ")
            .filter(word => word !== "");

          return groupedLogs.value.filter(group => {
            let groupText =
              `${group.no} ` +
              `${group.customer} ` +
              `${group.output} `;

            group.records.forEach(log => {
              groupText +=
                `${log["TS"] || log["タイムスタンプ"] || log["日付"] || ""} ` +
                `${log["作業内容"] || ""} ` +
                `${log["担当"] || ""} ` +
                `${log["備考（引継ぎ・進捗状況等）"] || log["備考"] || ""} ` +
                `${log["完了確認"] || ""} `;
            });

            groupText = groupText.toLowerCase();

            return searchWords.every(word =>
              groupText.includes(word)
            );
          });
        });

        const totalRecordsCount = computed(() => {
          return filteredGroupedLogs.value.reduce(
            (sum, group) => sum + group.records.length,
            0
          );
        });

        const showYesterday = () => {
          const d = new Date();

          d.setDate(d.getDate() - 1);

          searchQuery.value =
            `${d.getFullYear()}/` +
            `${String(d.getMonth() + 1).padStart(2, "0")}/` +
            `${String(d.getDate()).padStart(2, "0")}`;
        };

        const clearSearch = () => {
          searchQuery.value = "";
        };
        
        const handlePageHide = () => {
          isPageActive = false;
          cancelActiveRequest();
        };

        const handlePageShow = (event) => {
          isPageActive = true;

          if (!event.persisted) {
            return;
          }

          const cacheState = loadCachedData();

          if (!cacheState.isFresh) {
            fetchAllData();
          }
        };

        onMounted(() => {
          const cacheState = loadCachedData();

          if (!cacheState.isFresh) {
            fetchAllData();
          }

          window.addEventListener(
            "pagehide",
            handlePageHide
          );
          window.addEventListener(
            "pageshow",
            handlePageShow
          );
        });

        onBeforeUnmount(() => {
          window.removeEventListener(
            "pagehide",
            handlePageHide
          );
          window.removeEventListener(
            "pageshow",
            handlePageShow
          );
          cancelActiveRequest();
        });
        
        return { 
          searchQuery, 
          filteredGroupedLogs, 
          totalRecordsCount, 
          isLoading,
          isRefreshing,
          hasUsableData,
          error, 
          showYesterday, 
          clearSearch,
          refreshData,
          formatDate,
          calcLeadTimeText,
          isGroupExpanded,
          toggleGroup,
          getVisibleRecords,
          getTantoLabel
        };
      }
    }).mount("#app");
  </script>
</body>
</html>
